<div class="flex items-center gap-3">

<!-- Empty Rows -->
<div class="flex items-center gap-3">

</div>
<div class="flex items-center gap-3">
<div class="flex-shrink-0 w-8 h-8 rounded-full border-2 border-navy-raised flex items-center justify-center bg-navy-ground font-headline font-bold text-brand-muted">6</div>

<div class="flex items-center gap-3">

<div class="flex items-center gap-3">
<div class="flex-shrink-0 w-8 h-8 rounded-full border-2 border-navy-raised flex items-center justify-center bg-navy-ground font-headline font-bold text-brand-muted">8</div>

<div class="flex items-center gap-3">

<!-- Fixed Bottom Action -->
<div class="fixed bottom-0 left-0 w-full p-4 bg-gradient-to-t from-navy-ground via-navy-ground to-transparent z-40 pb-6 pointer-events-none">

            Submit answers

<!-- Image Modal (Hidden by default, meant for interaction) -->
<div class="fixed inset-0 z-[100] bg-navy-ground/95 backdrop-blur-sm hidden items-center justify-center p-2 opacity-0 transition-opacity duration-300" id="imageModal">
<button class="absolute top-4 right-4 p-2 bg-navy-surface rounded-full text-brand-cream hover:text-brand-gold" id="closeModal">
<span class="material-symbols-outlined text-2xl">close</span>
</button>
<img alt="Full size landmark collage" class="max-w-full max-h-[90vh] object-contain rounded-lg" src="https://lh3.googleusercontent.com/aida/AEtjO1UgC_5-fx3mJThiXlorg63_t0sw1PcjkDPebf71_LdG6LPZ6uMI2gjuycVY-CKGpP6pywHzSyhFQtdMd3reQg0wM2ykTozVhSEdWIkipwmwNhS-MbCXII5haveVPetyP9xpjWEh7lARw-xnRZj-RZS7QPfl7Vrmlht-ViztuNWvfPICPV5QE8FpiHR_149L038co5foR8jrh85e8ScwMRdLypHpkm21XbFyrmOJKkdtchgd0_zWIPCRe8w"/>
</div>
<script>
        // Simple script to handle image zooming (modal)
        const modal = document.getElementById('imageModal');
        const imgTrigger = document.querySelector('img[src="https://lh3.googleusercontent.com/aida/AEtjO1UgC_5-fx3mJThiXlorg63_t0sw1PcjkDPebf71_LdG6LPZ6uMI2gjuycVY-CKGpP6pywHzSyhFQtdMd3reQg0wM2ykTozVhSEdWIkipwmwNhS-MbCXII5haveVPetyP9xpjWEh7lARw-xnRZj-RZS7QPfl7Vrmlht-ViztuNWvfPICPV5QE8FpiHR_149L038co5foR8jrh85e8ScwMRdLypHpkm21XbFyrmOJKkdtchgd0_zWIPCRe8w"]');
        const closeBtn = document.getElementById('closeModal');

        imgTrigger.addEventListener('click', () => {
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            // small delay for transition
            setTimeout(() => modal.classList.remove('opacity-0'), 10);
            document.body.style.overflow = 'hidden'; // prevent scrolling behind
        });

        const closeModal = () => {
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                document.body.style.overflow = '';
            }, 300);
        };

        closeBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if(e.target === modal) closeModal();
        });
    </script>
</body></html>
