<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Know It Owl - Lobby</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Public+Sans:wght@400;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        navy: {
                            ground: '#0E1A2F',
                            surface: '#16294A',
                            raised: '#1E3765'
                        },
                        brand: {
                            gold: '#F5A81C',
                            amber: '#F0821E',
                            blue: '#2F7FE0',
                            cream: '#F7EFE2',
                            muted: '#9DB0CE',
                            green: '#3FB27F',
                            red: '#E5484D'
                        }
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px",
                        "card": "12px"
                    },
                    fontFamily: {
                        "headline": ["Public Sans", "sans-serif"],
                        "display": ["Public Sans", "sans-serif"],
                        "body": ["Plus Jakarta Sans", "sans-serif"],
                        "label": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    animation: {
                        'pulse-glow': 'pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'slide-in': 'slide-in 0.3s ease-out forwards',
                    },
                    keyframes: {
                        'pulse-glow': {
                            '0%, 100%': { boxShadow: '0 0 0px 0px rgba(245, 168, 28, 0)' },
                            '50%': { boxShadow: '0 0 10px 2px rgba(245, 168, 28, 0.3)' },
                        },
                        'slide-in': {
                            '0%': { transform: 'translateY(10px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        }
                    }
                }
            },
        }
    </script>
<style>
        body {
            background-color: #0E1A2F;
            color: #F7EFE2;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        
        .code-text {
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: 0.15em;
        }
    </style>
</head>
<body class="bg-navy-ground text-brand-cream min-h-screen flex flex-col pt-safe pb-safe selection:bg-brand-gold selection:text-navy-ground">
<!-- Top Navigation (Shell) -->
<header class="flex items-center justify-between px-6 h-16 w-full fixed top-0 bg-[#0E1A2F] border-b border-[#1E3765] z-50 pt-safe">
<div class="flex items-center gap-3">
<img alt="Know It Owl Logo" class="w-8 h-8 rounded-full object-cover shadow-sm" src="https://lh3.googleusercontent.com/aida/AEtjO1VI0HLn7IsZPX6y8SuYNRpg0wPynlweBRxjITHx4C_FlqmIvHCc57Q_AC5ee6LOiqxmPxftM9BwvstuZsQitdWfH5xFh8BolVZ5WojL9iwFBTp9LQDPMoRR-aeiWkBtW3ad5njCBqloUyboHXos6_oIvi8SLgRjVHDmpz7Zp1zNlmPlAI_6wbTBBx1YixTaI7uXwzTxvVIA5GhEy0pxeL9hxJGNKSUhSXjAW3WIqZwyLRocr1J7o7H7MAI"/>
<h1 class="font-headline font-black tracking-tight text-2xl text-[#F5A81C] tracking-tighter">Know It Owl</h1>
</div>
<div class="flex items-center gap-2 bg-navy-surface px-3 py-1 rounded-full border border-navy-raised">
<div class="w-2 h-2 rounded-full bg-brand-green animate-pulse"></div>
<span class="font-label text-xs font-bold text-brand-cream">Live</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-[390px] mx-auto px-6 pt-24 pb-32 flex flex-col gap-8">
<!-- Game Code Section -->
<section class="flex flex-col items-center justify-center pt-4">
<h2 class="font-label text-xs font-bold text-brand-muted uppercase tracking-widest mb-2">Game Code</h2>
<div class="flex items-center gap-4 bg-navy-surface px-6 py-4 rounded-xl border border-navy-raised shadow-lg relative group">
<span class="code-text text-4xl font-black text-brand-gold">OWL842</span>
<button aria-label="Copy game code" class="flex items-center justify-center p-2 rounded-full hover:bg-navy-raised transition-colors active:scale-95 text-brand-muted hover:text-brand-cream">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">content_copy</span>
</button>
<div class="absolute inset-0 rounded-xl ring-1 ring-inset ring-brand-gold/20 pointer-events-none"></div>
</div>
</section>
<!-- Player List Section -->
<section class="flex flex-col gap-4">
<div class="flex items-end justify-between px-1">
<h3 class="font-headline font-bold text-lg text-brand-cream">In the lobby</h3>
<span class="font-label text-sm font-medium text-brand-muted">6 players</span>
</div>
<div class="flex flex-col gap-3">
<!-- Player Row (You) -->
<div class="flex items-center justify-between p-3 rounded-[12px] bg-navy-surface border border-navy-raised transition-all">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-brand-blue/20 flex items-center justify-center text-brand-blue font-bold text-lg border border-brand-blue/30">
                            A
                        </div>
<span class="font-body font-semibold text-brand-cream">Alex P.</span>
</div>
<span class="px-2 py-1 bg-brand-gold text-navy-ground font-label text-[10px] font-black uppercase tracking-wider rounded-full">
                        You
                    </span>
</div>
<!-- Player Row -->
<div class="flex items-center justify-between p-3 rounded-[12px] bg-navy-surface border border-transparent transition-all">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-brand-muted/20 flex items-center justify-center text-brand-muted font-bold text-lg">
                            S
                        </div>
<span class="font-body font-medium text-brand-cream">Sam G.</span>
</div>
</div>
<!-- Player Row -->
<div class="flex items-center justify-between p-3 rounded-[12px] bg-navy-surface border border-transparent transition-all">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-brand-muted/20 flex items-center justify-center text-brand-muted font-bold text-lg">
                            M
                        </div>
<span class="font-body font-medium text-brand-cream">Mia T.</span>
</div>
</div>
<!-- Player Row -->
<div class="flex items-center justify-between p-3 rounded-[12px] bg-navy-surface border border-transparent transition-all">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-brand-muted/20 flex items-center justify-center text-brand-muted font-bold text-lg">
                            D
                        </div>
<span class="font-body font-medium text-brand-cream">David R.</span>
</div>
</div>
<!-- Player Row -->
<div class="flex items-center justify-between p-3 rounded-[12px] bg-navy-surface border border-transparent transition-all">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-brand-muted/20 flex items-center justify-center text-brand-muted font-bold text-lg">
                            E
                        </div>
<span class="font-body font-medium text-brand-cream">Elena V.</span>
</div>
</div>
<!-- Player Row (New Arrival) -->
<div class="flex items-center justify-between p-3 rounded-[12px] bg-navy-surface border-l-4 border-l-brand-gold border-y border-y-navy-raised border-r border-r-navy-raised animate-slide-in relative overflow-hidden">
<div class="absolute inset-0 bg-brand-gold/5 pointer-events-none animate-pulse-glow"></div>
<div class="flex items-center gap-3 relative z-10">
<div class="w-10 h-10 rounded-full bg-brand-gold/20 flex items-center justify-center text-brand-gold font-bold text-lg border border-brand-gold/30">
                            J
                        </div>
<span class="font-body font-semibold text-brand-cream">Jamie K.</span>
</div>
<span class="font-label text-[10px] text-brand-gold font-bold relative z-10 animate-pulse">Just joined</span>
</div>
</div>
</section>
</main>
<!-- Bottom Pinned Action Panel (Host View) -->
<div class="fixed bottom-0 left-0 w-full bg-navy-ground border-t border-brand-gold/30 pt-4 pb-safe px-6 shadow-[0_-10px_20px_rgba(0,0,0,0.5)] z-40">
<div class="max-w-[390px] mx-auto w-full flex flex-col gap-4 mb-4">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-brand-gold text-sm" style="font-variation-settings: 'FILL' 1;">stars</span>
<span class="font-label text-[10px] font-bold text-brand-gold uppercase tracking-widest">Host Controls</span>
</div>
<div class="flex items-center justify-between bg-navy-surface p-3 rounded-xl border border-navy-raised">
<span class="font-body font-medium text-brand-cream">Number of Teams</span>
<div class="flex items-center gap-4 bg-navy-ground rounded-full p-1 border border-navy-raised">
<button class="w-8 h-8 rounded-full flex items-center justify-center text-brand-muted hover:text-brand-cream hover:bg-navy-surface active:scale-95 transition-all">
<span class="material-symbols-outlined">remove</span>
</button>
<span class="font-headline font-bold text-xl text-brand-cream w-4 text-center">2</span>
<button class="w-8 h-8 rounded-full flex items-center justify-center text-brand-muted hover:text-brand-cream hover:bg-navy-surface active:scale-95 transition-all">
<span class="material-symbols-outlined">add</span>
</button>
</div>
</div>
<button class="w-full py-4 bg-brand-gold text-navy-ground rounded-full font-headline font-bold text-lg shadow-[0_4px_14px_rgba(245,168,28,0.39)] hover:bg-brand-amber active:scale-95 transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">shuffle</span>
                Draw the teams
            </button>
</div>
</div>
<!-- 
      Note: BottomNavBar is intentionally suppressed here as per the "Destination Rule"
      This is a linear/transactional lobby screen (a "waiting room" before the game starts), 
      not a top-level navigation destination. The Host Action Panel takes priority.
    -->
</body></html>
