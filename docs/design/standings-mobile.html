<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Standings - Know It Owl</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Public+Sans:wght@700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        navy: {
                            ground: '#0E1A2F',
                            surface: '#16294A',
                            raised: '#1E3765'
                        },
                        brand: {
                            gold: '#F5A81C',
                            amber: '#F0821E',
                            blue: '#2F7FE0',
                            cream: '#F7EFE2',
                            muted: '#9DB0CE',
                            green: '#3FB27F',
                            red: '#E5484D'
                        }
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                    fontFamily: {
                        "headline": ["Public Sans", "sans-serif"],
                        "display": ["Public Sans", "sans-serif"],
                        "body": ["Plus Jakarta Sans", "sans-serif"],
                        "label": ["Plus Jakarta Sans", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #0E1A2F; /* navy-ground fallback */
            color: #F7EFE2; /* cream fallback */
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-navy-ground text-brand-cream font-body antialiased min-h-screen flex flex-col pt-14 pb-20">
<!-- TopAppBar from JSON -->
<header class="bg-[#0E1A2F] border-b border-[#1E3765] fixed top-0 w-full z-50 flex justify-between items-center px-4 py-3 h-14">
<div class="flex items-center gap-3">
<img alt="Know It Owl Logo" class="w-8 h-8 rounded-full object-cover border-2 border-brand-gold" src="https://lh3.googleusercontent.com/aida/AEtjO1VI0HLn7IsZPX6y8SuYNRpg0wPynlweBRxjITHx4C_FlqmIvHCc57Q_AC5ee6LOiqxmPxftM9BwvstuZsQitdWfH5xFh8BolVZ5WojL9iwFBTp9LQDPMoRR-aeiWkBtW3ad5njCBqloUyboHXos6_oIvi8SLgRjVHDmpz7Zp1zNlmPlAI_6wbTBBx1YixTaI7uXwzTxvVIA5GhEy0pxeL9hxJGNKSUhSXjAW3WIqZwyLRocr1J7o7H7MAI"/>
<span class="text-[#F5A81C] font-headline font-black text-xl tracking-tighter uppercase">Know It Owl</span>
</div>
<div class="flex items-center">
<div class="flex items-center gap-1.5 bg-brand-green/10 px-2 py-1 rounded-full border border-brand-green/30">
<span class="w-2 h-2 rounded-full bg-brand-green animate-pulse"></span>
<span class="text-brand-green font-label text-[10px] font-bold tracking-widest uppercase">Live</span>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow px-4 pt-6 pb-8 max-w-lg mx-auto w-full">
<!-- Header Section -->
<div class="text-center mb-8">
<p class="text-brand-muted font-label text-xs tracking-widest uppercase mb-1 font-semibold">After 4 Rounds</p>
<h1 class="font-headline text-3xl font-black text-brand-cream tracking-tight uppercase">Final Standings</h1>
</div>
<!-- 1st Place Hero Card -->
<div class="bg-navy-surface rounded-xl p-6 mb-6 relative overflow-hidden border border-brand-gold/30 shadow-lg shadow-brand-gold/10">
<!-- Decorative Gold Accents -->
<div class="absolute -top-10 -right-10 w-32 h-32 bg-brand-gold/10 rounded-full blur-2xl"></div>
<div class="flex justify-between items-center relative z-10">
<div class="flex items-center gap-4">
<div class="w-12 h-12 bg-brand-gold text-navy-ground rounded-full flex items-center justify-center font-headline text-2xl font-black shadow-md shadow-brand-gold/20">
                        1
                    </div>
<div>
<h2 class="text-brand-gold font-headline text-2xl font-bold tracking-tight">Quiz Khalifa</h2>
<p class="text-brand-muted font-body text-sm mt-0.5 flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'FILL' 1;">bolt</span>
                            Doubled round 3
                        </p>
</div>
</div>
<div class="text-right">
<div class="font-headline text-5xl font-black text-brand-cream tracking-tighter">42</div>
<div class="text-brand-muted font-label text-[10px] uppercase tracking-wider font-semibold">Pts</div>
</div>
</div>
</div>
<!-- Ranked List -->
<div class="space-y-3 mb-8">
<!-- Rank 2 (Your Team) -->
<div class="bg-navy-surface rounded-lg p-4 flex justify-between items-center border-2 border-brand-gold relative">
<div class="absolute -top-2.5 left-4 bg-brand-gold text-navy-ground font-label text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">
                    Your Team
                </div>
<div class="flex items-center gap-4">
<div class="w-8 h-8 flex items-center justify-center font-headline text-xl font-bold text-brand-cream opacity-80">
                        2
                    </div>
<div>
<h3 class="text-brand-cream font-headline text-lg font-bold tracking-tight">The Night Owls</h3>
<p class="text-brand-muted font-body text-xs mt-0.5 flex items-center gap-1">
<span class="material-symbols-outlined text-[12px] text-brand-amber" style="font-variation-settings: 'FILL' 1;">bolt</span>
                            Doubled round 4
                        </p>
</div>
</div>
<div class="font-headline text-2xl font-bold text-brand-cream">38</div>
</div>
<!-- Rank 3 -->
<div class="bg-navy-surface rounded-lg p-4 flex justify-between items-center border border-navy-raised">
<div class="flex items-center gap-4">
<div class="w-8 h-8 flex items-center justify-center font-headline text-xl font-bold text-brand-muted">
                        3
                    </div>
<div>
<h3 class="text-brand-cream font-headline text-lg font-bold tracking-tight">Smarty Pants</h3>
<p class="text-brand-muted font-body text-xs mt-0.5 flex items-center gap-1">
<span class="material-symbols-outlined text-[12px]" style="font-variation-settings: 'FILL' 1;">bolt</span>
                            Doubled round 2
                        </p>
</div>
</div>
<div class="font-headline text-2xl font-bold text-brand-cream">31</div>
</div>
<!-- Rank 4 -->
<div class="bg-navy-surface rounded-lg p-4 flex justify-between items-center border border-navy-raised opacity-75">
<div class="flex items-center gap-4">
<div class="w-8 h-8 flex items-center justify-center font-headline text-xl font-bold text-brand-muted/70">
                        4
                    </div>
<div>
<h3 class="text-brand-cream font-headline text-lg font-bold tracking-tight">Trivia Newton-John</h3>
<p class="text-brand-red font-body text-xs mt-0.5 flex items-center gap-1">
<span class="material-symbols-outlined text-[12px]">close</span>
                            Double unused
                        </p>
</div>
</div>
<div class="font-headline text-2xl font-bold text-brand-muted">24</div>
</div>
</div>
<!-- Footer Actions -->
<div class="flex flex-col items-center gap-4 mt-8">
<p class="text-brand-muted font-body text-sm text-center">Thanks for playing!</p>
<button class="w-full border-2 border-brand-muted text-brand-cream font-headline font-bold text-lg py-4 px-6 rounded-full active:scale-95 transition-transform hover:border-brand-cream hover:bg-navy-surface">
                Start a new game
            </button>
</div>
</main>
<!-- BottomNavBar from JSON -->
<!-- The page intent is "Standing", so that item is active -->
<nav class="bg-[#16294A] border-t border-[#1E3765] shadow-2xl fixed bottom-0 left-0 w-full z-50 rounded-t-xl flex justify-around items-center px-4 pb-4 pt-2 md:hidden">
<!-- Quiz - Inactive -->
<button class="flex flex-col items-center justify-center text-[#9DB0CE] hover:text-[#F7EFE2] active:scale-90 transition-all duration-200 p-2 min-w-[64px]">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">quiz</span>
<span class="font-label text-xs font-medium">Quiz</span>
</button>
<!-- Team - Inactive -->
<button class="flex flex-col items-center justify-center text-[#9DB0CE] hover:text-[#F7EFE2] active:scale-90 transition-all duration-200 p-2 min-w-[64px]">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">groups</span>
<span class="font-label text-xs font-medium">Team</span>
</button>
<!-- Standing - Active -->
<button class="flex flex-col items-center justify-center text-[#F5A81C] bg-[#1E3765] rounded-full px-4 py-1 active:scale-90 transition-all duration-200 min-w-[80px]">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">leaderboard</span>
<span class="font-label text-xs font-medium">Standing</span>
</button>
</nav>
</body></html>
