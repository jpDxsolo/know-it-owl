schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

enum GameStatus {
  LOBBY
  TEAMS_SET
  ROUND_ACTIVE
  GRADING
  REVEAL
  FINISHED
}

enum QuestionType {
  TEXT
  PICTURE_10
}

enum RoundStatus {
  DRAFT
  ACTIVE
  GRADING
  REVEALED
}

type Game {
  id: ID!
  joinCode: String!
  status: GameStatus!
  currentRound: Int
  players: [Player!]!
  teams: [Team!]!
  "Rounds this viewer may see. Players never see DRAFT rounds."
  rounds: [Round!]!
}

type Player {
  id: ID!
  displayName: String!
  teamId: ID
}

type Team {
  id: ID!
  name: String!
  score: Int!
  doubleUsedRound: Int
  "Most recent round this team has handed in for; null until they submit one. Lets a teammate's device lock itself the moment anyone submits."
  lastSubmittedRound: Int
  players: [Player!]!
}

type Round {
  number: Int!
  category: String!
  status: RoundStatus!
  "How many questions the GM has unveiled. Players never see beyond it."
  releasedCount: Int!
  "How many questions the round holds in total. A count, never the content — it is what tells a team the host has finished releasing."
  questionCount: Int!
  questions: [Question!]!
}

type Question {
  number: Int!
  type: QuestionType!
  text: String
  imageUrl: String
  defaultPoints: Int!
  "Only populated after the round is revealed."
  correctAnswers: [String!]
}

type TeamResponse {
  roundNumber: Int!
  questionNumber: Int!
  teamId: ID!
  answers: [String!]!
  doubled: Boolean!
  graded: Boolean!
  gradedPoints: [Int!]
}

type RoundResult {
  round: Round!
  responses: [TeamResponse!]!
  standings: [Team!]!
}

type CreateGamePayload {
  game: Game!
  "Secret token authorizing GM-only mutations. Shown once; keep it safe."
  gmToken: String!
}

type UploadUrlPayload {
  uploadUrl: String!
  imageKey: String!
}

"Coarse-grained update fanned out to onGameUpdated subscribers."
type GameUpdate {
  gameId: ID!
  status: GameStatus!
  currentRound: Int
  "Event hint, e.g. PLAYER_JOINED, TEAMS_SET, ROUND_STARTED, ROUND_REVEALED."
  event: String!
  game: Game!
  "The player this event is about. Only set on PLAYER_JOINED, so the joiner can read back the seat it was given."
  player: Player
}

input QuestionInput {
  type: QuestionType!
  text: String
  imageKey: String
  correctAnswers: [String!]!
  defaultPoints: Int!
}

input SubmitAnswersInput {
  gameId: ID!
  playerId: ID!
  roundNumber: Int!
  "One entry per question; PICTURE_10 answers are the 10 strings for that question."
  answers: [QuestionAnswersInput!]!
  double: Boolean
}

input QuestionAnswersInput {
  questionNumber: Int!
  answers: [String!]!
}

input GradeResponseInput {
  gameId: ID!
  gmToken: String!
  roundNumber: Int!
  questionNumber: Int!
  teamId: ID!
  points: [Int!]!
}

type Query {
  "Pass the GM token to get the authoring view; without it the result is the player view."
  game(gameId: ID!, gmToken: String): Game
  myTeam(gameId: ID!, playerId: ID!): Team
  "Pre-reveal this is GM-only; pass the token. After the reveal it is public and carries the answers."
  roundResults(gameId: ID!, roundNumber: Int!, gmToken: String): RoundResult
  standings(gameId: ID!): [Team!]!
}

type Mutation {
  createGame: CreateGamePayload!
  joinGame(joinCode: String!, playerId: ID!, displayName: String!): GameUpdate!
  randomizeTeams(gameId: ID!, gmToken: String!, teamCount: Int!): GameUpdate!
  setTeamName(gameId: ID!, playerId: ID!, teamId: ID!, name: String!): GameUpdate!
  createRound(gameId: ID!, gmToken: String!, category: String!, questions: [QuestionInput!]!): Round!
  startRound(gameId: ID!, gmToken: String!, roundNumber: Int!): GameUpdate!
  "Unveil the next question. Strictly sequential: questionNumber must be releasedCount + 1."
  releaseQuestion(gameId: ID!, gmToken: String!, roundNumber: Int!, questionNumber: Int!): GameUpdate!
  chooseDouble(gameId: ID!, playerId: ID!, roundNumber: Int!): GameUpdate!
  submitAnswers(input: SubmitAnswersInput!): GameUpdate!
  gradeResponse(input: GradeResponseInput!): TeamResponse!
  endRound(gameId: ID!, gmToken: String!, roundNumber: Int!): GameUpdate!
  "contentLength is signed into the URL, so the upload must be exactly that many bytes."
  getImageUploadUrl(gameId: ID!, gmToken: String!, contentType: String!, contentLength: Int!): UploadUrlPayload!
}

type Subscription {
  onGameUpdated(gameId: ID!): GameUpdate
    @aws_subscribe(
      mutations: [
        "joinGame"
        "randomizeTeams"
        "setTeamName"
        "startRound"
        "releaseQuestion"
        "chooseDouble"
        "submitAnswers"
        "endRound"
      ]
    )
}
